name: Update LoL Data

on:
  schedule:
    # Every day at 6:00 UTC
    - cron: '0 6 * * *'
  # Manual trigger
  workflow_dispatch:
  # On push to main
  push:
    branches: [main]

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Generate data files
        run: python scripts/update_data.py

      - name: Check for changes
        id: git-check
        run: |
          git add -A
          git diff --staged --quiet || echo "changes=true" >> $GITHUB_OUTPUT

      - name: Commit and push if changed
        if: steps.git-check.outputs.changes == 'true'
        run: |
          git config user.name "lol-wiki"
          git config user.email "lol-wiki@users.noreply.github.com"
          git commit -m "chore: auto-update LoL data to latest patch"
          git push
